<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111315" />
  <meta name="description" content="Portal central de aplicaciones ITSQMET." />
  <title>ITSQMET | Portal de Aplicaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="shell topbar__inner">
      <a class="brand" href="#inicio" aria-label="ITSQMET - Inicio">
        <img class="brand__logo" src="assets/logo-itsqmet.webp" alt="ITSQMET" />
      </a>

      <div class="search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/></svg>
        <input id="search-input" type="search" placeholder="Buscar aplicación..." autocomplete="off" aria-label="Buscar aplicación" />
        <button id="search-clear" class="search__clear" type="button" aria-label="Limpiar búsqueda" hidden>×</button>
      </div>

      <div class="topbar__meta">
        <strong id="app-count">8</strong>
        <span>accesos</span>
      </div>
    </div>
  </header>

  <main id="inicio" class="shell workspace">
    <div class="page-head">
      <div>
        <span class="eyebrow">Portal institucional</span>
        <h1>Aplicaciones ITSQMET</h1>
      </div>
      <p id="results-note" class="results-note" aria-live="polite"></p>
    </div>

    <section id="group-grid" class="group-grid" aria-label="Áreas de aplicaciones"></section>

    <div class="empty-state" id="empty-state" hidden>
      <strong>No encontramos esa aplicación</strong>
      <span>Prueba con otro nombre.</span>
    </div>
  </main>

  <footer class="footer">
    <div class="shell footer__inner">
      <span>ITSQMET · Portal de Aplicaciones</span>
      <span>Acceso centralizado</span>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
